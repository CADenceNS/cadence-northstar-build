name: Sprint 13A Validation

on:
  push:
    branches:
      - feature/sprint-13a-uat-interactive-platform
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar
          POSTGRES_DB: northstar_intake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northstar -d northstar_intake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://northstar:northstar@127.0.0.1:5432/northstar_intake
      NORTHSTAR_TENANT_ID: 00000000-0000-0000-0000-000000000001
      NORTHSTAR_BOOTSTRAP_PASSWORD: NorthStar!2026
      NORTHSTAR_UAT_PASSWORD: NorthStar!2026-UAT
      NORTHSTAR_ENVIRONMENT: uat
      NORTHSTAR_BUILD_VERSION: 0.13.0-uat
      GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frozen dependency installation
        run: pnpm install --frozen-lockfile
      - name: Strict TypeScript and production build
        run: pnpm typecheck && pnpm build
      - name: Apply versioned migrations 0001 through 0016
        run: pnpm --filter @northstar/api migrate
      - name: Validate versioned migration ledger matrix
        run: pnpm --filter @northstar/api test:migration-runner
      - name: Run inherited persistence, security, communications, and intake contracts
        run: |
          pnpm --filter @northstar/api test:repositories
          pnpm --filter @northstar/api test:migrations
          pnpm --filter @northstar/api test:postgres-repositories
          pnpm --filter @northstar/api test:security
          pnpm --filter @northstar/api test:communications
          pnpm --filter @northstar/api test:digital-intake
          pnpm --filter @northstar/api test:tenant-native
          pnpm --filter @northstar/api test:commercial-entitlements
          pnpm --filter @northstar/api test:commercial-licensing
          pnpm --filter @northstar/api test:product-pricing
          pnpm --filter @northstar/api test:case-builder
          pnpm --filter @northstar/api test:case-journey
          pnpm --filter @northstar/api test:case-operations
      - name: Run Sprint 13A UAT integrations
        run: |
          pnpm --filter @northstar/api test:uat
          pnpm --filter @northstar/api test:uat-attachments
      - name: Validate migrations 0010–0016 rollback and reapplication
        run: |
          # Integration fixtures create repository-backed product lines. Remove only
          # those ephemeral fixtures before proving the historical 0011 rollback.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM case_product_line_lineage; DELETE FROM case_product_tat_overrides WHERE case_entity_type='case'; DELETE FROM case_product_lines WHERE case_entity_type='case'; DELETE FROM case_product_line_case_entities WHERE case_entity_type='case';"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0016_operational_case_intake_foundation.rollback.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0015_case_builder_structured_configuration.rollback.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0014_case_builder_product_line_authority.rollback.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0013_case_journey_foundation.rollback.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0012_patient_reference_optional.rollback.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0011_product_pricing_case_line_items.rollback.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0010_commercial_activation_licensing.rollback.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0010_commercial_activation_licensing.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0011_product_pricing_case_line_items.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0012_patient_reference_optional.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0013_case_journey_foundation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0014_case_builder_product_line_authority.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0015_case_builder_structured_configuration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/0016_operational_case_intake_foundation.sql
      - name: Start secure application services
        run: |
          pnpm --filter @northstar/api dev > /tmp/sprint13a-api.log 2>&1 &
          pnpm --filter @northstar/web dev --host 127.0.0.1 > /tmp/sprint13a-web.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sprint13a-api.log /tmp/sprint13a-web.log
          exit 1
      - name: Validate secure UAT API lifecycle
        shell: bash
        run: |
          set -euo pipefail
          LOGIN=$(curl -fsS -c /tmp/session-cookie -X POST http://127.0.0.1:4000/api/auth/login -H 'Content-Type: application/json' -d '{"email":"tenant.owner@keramos-uat.example","password":"NorthStar!2026-UAT","rememberMe":true}')
          CSRF=$(python -c 'import json,sys;print(json.load(sys.stdin)["csrfToken"])' <<<"$LOGIN")
          # The rollback/reapply block above deliberately uses raw SQL, so it does
          # not alter the versioned migration ledger used by the health endpoint.
          curl -fsS -b /tmp/session-cookie http://127.0.0.1:4000/api/system/information | grep '"migrationVersion":"0016"'
          curl -fsS -b /tmp/session-cookie -X POST http://127.0.0.1:4000/api/uat/seed -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{}' | grep '240'
          curl -fsS -b /tmp/session-cookie http://127.0.0.1:4000/api/uat/readiness | grep 'buildVersion'
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run complete Playwright regression suite
        run: pnpm test:e2e
      - name: Print logs on failure
        if: failure()
        run: cat /tmp/sprint13a-api.log /tmp/sprint13a-web.log || true
