name: Sprint 03 Validation

on:
  push:
    branches:
      - feature/sprint-03-practice-doctor-management
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sprint-03-practice-doctor-management
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align legacy records with Sprint 3 contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('apps/web/src/App.tsx')
          source=path.read_text()
          source=source.replace(
            "scannerType:'iTero', createdAt:new Date().toISOString() }];",
            "scannerType:'iTero', officeManager:{name:'Alex Morgan',email:'manager@northstardental.example',phone:'818-555-0199'}, notes:'', communicationHistory:[], createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() }];",
            1
          )
          source=source.replace(
            "phone:'818-555-0171', active:true, createdAt:new Date().toISOString() }];",
            "phone:'818-555-0171', status:'active', active:true, notes:'', communicationHistory:[], createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() }];",
            1
          )
          source=source.replace(
            "scannerType:'iTero',createdAt:new Date().toISOString()});",
            "scannerType:'iTero',officeManager:{name:'',email:'',phone:''},notes:'',communicationHistory:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()} as Practice);",
            1
          )
          source=source.replace(
            "phone:'',active:true,createdAt:new Date().toISOString()});",
            "phone:'',status:'active',active:true,notes:'',communicationHistory:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()} as Doctor);",
            1
          )
          source=source.replace(
            "onChange={e=>setForm({...form,active:e.target.checked})}",
            "onChange={e=>setForm({...form,active:e.target.checked,status:e.target.checked?'active':'inactive'})}"
          )
          path.write_text(source)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/App.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Align legacy directory records with Sprint 3 contracts'
            git push origin HEAD:feature/sprint-03-practice-doctor-management
          fi
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        shell: bash
        run: |
          set -o pipefail
          (pnpm typecheck && pnpm build) 2>&1 | tee /tmp/sprint03-build.log
      - name: Start services
        run: |
          pnpm --filter @northstar/api dev > /tmp/api.log 2>&1 &
          pnpm --filter @northstar/web dev --host 127.0.0.1 > /tmp/web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/api.log /tmp/web.log
          exit 1
      - name: Validate management APIs
        run: |
          curl -fsS http://127.0.0.1:4000/api/practices | grep -q 'KDL-1001'
          curl -fsS http://127.0.0.1:4000/api/doctors | grep -q 'Beibei'
          curl -fsS -H 'Content-Type: application/json' -d '{"practiceName":"API Test Practice","status":"active","phone":"747-240-4008","email":"api@example.com","address":"","city":"Northridge","state":"CA","postalCode":"91324","taxExempt":false,"scannerType":"iTero","officeManager":{"name":"API Manager","email":"manager-api@example.com","phone":""},"notes":"Verified"}' http://127.0.0.1:4000/api/practices | grep -q 'KDL-1002'
          curl -fsS http://127.0.0.1:4000/api/dashboard | grep -q 'activePractices'
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright lifecycle
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee /tmp/sprint03-playwright.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint03-validation-logs
          path: |
            /tmp/sprint03-build.log
            /tmp/sprint03-playwright.log
            /tmp/api.log
            /tmp/web.log
          if-no-files-found: ignore
