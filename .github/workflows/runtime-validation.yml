name: Runtime Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar
          POSTGRES_DB: northstar_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northstar -d northstar_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://northstar:northstar@127.0.0.1:5432/northstar_runtime
      NORTHSTAR_TENANT_ID: 00000000-0000-0000-0000-000000000001
      NORTHSTAR_BOOTSTRAP_PASSWORD: NorthStar!2026
      NORTHSTAR_UAT_PASSWORD: NorthStar!2026-UAT
      NORTHSTAR_ENVIRONMENT: uat
      NORTHSTAR_BUILD_VERSION: 0.13.0-uat
      GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify reproducible install
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm typecheck && pnpm build
      - name: Run Design Studio deterministic geometry suite
        run: pnpm --filter @cadence/design-studio test
      - name: Apply migrations 0001 through 0010
        run: |
          for migration in apps/api/migrations/0001_infrastructure_core.sql apps/api/migrations/0002_repository_documents.sql apps/api/migrations/0003_identity_security.sql apps/api/migrations/0004_clinical_communications.sql apps/api/migrations/0005_digital_intake_platform.sql apps/api/migrations/0006_intake_administration.sql apps/api/migrations/0007_uat_foundation.sql apps/api/migrations/0008_tenant_native_operations.sql apps/api/migrations/0009_commercial_entitlements.sql apps/api/migrations/0010_commercial_activation_licensing.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Run UAT integrations
        run: |
          pnpm --filter @northstar/api test:tenant-native
          pnpm --filter @northstar/api test:commercial-entitlements
          pnpm --filter @northstar/api test:commercial-licensing
          pnpm --filter @northstar/api test:uat
          pnpm --filter @northstar/api test:uat-attachments
      - name: Start API
        run: pnpm --filter @northstar/api dev > /tmp/northstar-api.log 2>&1 &
      - name: Wait for API health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4000/health >/tmp/health.json; then cat /tmp/health.json; exit 0; fi
            sleep 1
          done
          cat /tmp/northstar-api.log
          exit 1
      - name: Start web application
        run: |
          pnpm --filter @northstar/web dev --host 127.0.0.1 > /tmp/northstar-web.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ >/tmp/index.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/northstar-web.log
          exit 1
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate complete browser lifecycle
        run: pnpm test:e2e
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-validation-diagnostics
          path: |
            /tmp/northstar-api.log
            /tmp/northstar-web.log
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Print service logs on failure
        if: failure()
        run: |
          echo '--- API log ---'
          cat /tmp/northstar-api.log || true
          echo '--- Web log ---'
          cat /tmp/northstar-web.log || true
